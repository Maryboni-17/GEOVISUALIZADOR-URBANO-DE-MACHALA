<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <title>Geovisualizador urbano</title>

    <style>
        :root {
            --sidebar-width: 320px;
            --primary: #174f3d;
            --primary-dark: #103b2e;
            --surface: #ffffff;
            --page-bg: #edf2ef;
            --text: #1c2b25;
            --muted: #68766f;
            --border: #d9e3dd;
            --shadow: 0 12px 34px rgba(14, 47, 36, 0.18);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: var(--page-bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        body { display: flex; }

        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 22px 20px;
            color: #fff;
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
        }

        .sidebar-kicker {
            margin: 0 0 7px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            opacity: .78;
        }

        .sidebar-title {
            margin: 0;
            font-size: 24px;
            line-height: 1.15;
            font-weight: 750;
        }

        .sidebar-subtitle {
            margin: 9px 0 0;
            font-size: 13px;
            line-height: 1.45;
            opacity: .86;
        }

        .sidebar-content {
            padding: 18px 16px 24px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .section-title {
            margin: 2px 6px 12px;
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .layer-group {
            display: grid;
            gap: 8px;
        }

        .layer-row {
            display: grid;
            grid-template-columns: 38px 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 54px;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfdfc;
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
            cursor: pointer;
        }

        .layer-row:hover {
            border-color: #a8c2b5;
            box-shadow: 0 5px 16px rgba(23, 79, 61, .08);
            transform: translateY(-1px);
        }

        .layer-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: #eef5f1;
            overflow: hidden;
        }

        .layer-icon img {
            max-width: 27px;
            max-height: 27px;
            object-fit: contain;
        }

        .layer-name {
            display: block;
            font-size: 14px;
            font-weight: 650;
            line-height: 1.2;
        }

        .layer-note {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.2;
        }

        .layer-toggle {
            appearance: none;
            width: 38px;
            height: 22px;
            border: 0;
            border-radius: 999px;
            background: #c9d3ce;
            position: relative;
            cursor: pointer;
            transition: background .2s ease;
        }

        .layer-toggle::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 3px;
            left: 3px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.25);
            transition: transform .2s ease;
        }

        .layer-toggle:checked { background: var(--primary); }
        .layer-toggle:checked::after { transform: translateX(16px); }

        .sidebar-footer {
            margin-top: 18px;
            padding: 13px 12px;
            border-radius: 10px;
            background: #f1f6f3;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.45;
        }

        #map-shell {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #mobile-menu {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1100;
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 5px 16px rgba(0,0,0,.23);
            font-size: 18px;
            cursor: pointer;
        }

        /* Oculta únicamente el selector original generado por QGIS2Web. */
        .layer-switcher { display: none !important; }

        .ol-control > * {
            background-color: rgba(255,255,255,.96) !important;
            color: #33413b !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 9px rgba(0,0,0,.12);
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder { color: #444 !important; }

        .search-layer-input-search { background-color: rgba(255,255,255,.96) !important; }
        .ol-control > *:focus,
        .ol-control > *:hover { background-color: #fff !important; }
        .ol-control { background-color: transparent !important; padding: 2px !important; }

        @media (max-width: 760px) {
            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-105%);
                transition: transform .25s ease;
            }

            body.sidebar-open #sidebar { transform: translateX(0); }
            #mobile-menu { display: block; }
            body.sidebar-open #mobile-menu { left: calc(var(--sidebar-width) + 12px); }
        }

        @media (max-width: 390px) {
            :root { --sidebar-width: 286px; }
            .sidebar-title { font-size: 21px; }
        }
    </style>
</head>
<body>
    <aside id="sidebar" aria-label="Panel de capas">
        <header class="sidebar-header">
            <p class="sidebar-kicker">Sistema de información geográfica</p>
            <h1 class="sidebar-title">Geovisualizador urbano</h1>
            <p class="sidebar-subtitle">Activa o desactiva las capas para explorar la estructura urbana y sus equipamientos.</p>
        </header>

        <div class="sidebar-content">
            <h2 class="section-title">Capas del mapa</h2>
            <div class="layer-group">
                <label class="layer-row" for="check-limite">
                    <span class="layer-icon"><img src="styles/legend/LIMITE__2.png" alt=""></span>
                    <span><span class="layer-name">Límite del área</span><span class="layer-note">Delimitación del sector</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-limite">
                </label>

                <label class="layer-row" for="check-parcelas">
                    <span class="layer-icon"><img src="styles/legend/parcelas_3_3.png" alt=""></span>
                    <span><span class="layer-name">Parcelas</span><span class="layer-note">Clasificación por uso</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-parcelas">
                </label>

                <label class="layer-row" for="check-lotes">
                    <span class="layer-icon"><img src="styles/legend/lotes_urbanos_5_3.png" alt=""></span>
                    <span><span class="layer-name">Lotes urbanos</span><span class="layer-note">Uso y ocupación del suelo</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-lotes">
                </label>

                <label class="layer-row" for="check-red-vial">
                    <span class="layer-icon"><img src="styles/legend/red_vial_6.png" alt=""></span>
                    <span><span class="layer-name">Red vial</span><span class="layer-note">Vías urbanas</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-red-vial">
                </label>

                <label class="layer-row" for="check-areas-verdes">
                    <span class="layer-icon"><img src="styles/legend/areas_verdes_4.png" alt=""></span>
                    <span><span class="layer-name">Áreas verdes</span><span class="layer-note">Espacios recreativos</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-areas-verdes">
                </label>

                <label class="layer-row" for="check-equipamientos">
                    <span class="layer-icon"><img src="styles/legend/equipamientos_7_0.png" alt=""></span>
                    <span><span class="layer-name">Equipamientos</span><span class="layer-note">Educación y salud</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-equipamientos">
                </label>

                <label class="layer-row" for="check-buffer-educacion">
                    <span class="layer-icon"><img src="styles/legend/buffer_educacin_9.png" alt=""></span>
                    <span><span class="layer-name">Cobertura educativa</span><span class="layer-note">Área de influencia</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-buffer-educacion">
                </label>

                <label class="layer-row" for="check-buffer-salud">
                    <span class="layer-icon"><img src="styles/legend/buffer_salud_8.png" alt=""></span>
                    <span><span class="layer-name">Cobertura de salud</span><span class="layer-note">Área de influencia</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-buffer-salud">
                </label>

                <label class="layer-row" for="check-hidrografia">
                    <span class="layer-icon"><img src="styles/legend/hidrografia_1.png" alt=""></span>
                    <span><span class="layer-name">Hidrografía</span><span class="layer-note">Elementos hídricos</span></span>
                    <input class="layer-toggle" type="checkbox" id="check-hidrografia">
                </label>
            </div>

            <div class="sidebar-footer">
                Haz clic sobre los elementos del mapa para consultar sus atributos. El mapa base OpenStreetMap permanece activo.
            </div>
        </div>
    </aside>

    <main id="map-shell">
        <button id="mobile-menu" type="button" aria-label="Abrir o cerrar panel"><i class="fas fa-bars"></i></button>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
    </main>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>
    <script src="layers/hidrografia_1.js"></script>
    <script src="layers/LIMITE__2.js"></script>
    <script src="layers/parcelas_3.js"></script>
    <script src="layers/areas_verdes_4.js"></script>
    <script src="layers/lotes_urbanos_5.js"></script>
    <script src="layers/red_vial_6.js"></script>
    <script src="layers/equipamientos_7.js"></script>
    <script src="layers/buffer_salud_8.js"></script>
    <script src="layers/buffer_educacin_9.js"></script>
    <script src="styles/hidrografia_1_style.js"></script>
    <script src="styles/LIMITE__2_style.js"></script>
    <script src="styles/parcelas_3_style.js"></script>
    <script src="styles/areas_verdes_4_style.js"></script>
    <script src="styles/lotes_urbanos_5_style.js"></script>
    <script src="styles/red_vial_6_style.js"></script>
    <script src="styles/equipamientos_7_style.js"></script>
    <script src="styles/buffer_salud_8_style.js"></script>
    <script src="styles/buffer_educacin_9_style.js"></script>
    <script src="./layers/layers.js"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        (function () {
            function connectLayer(checkboxId, layer) {
                var checkbox = document.getElementById(checkboxId);
                if (!checkbox || !layer) return;

                checkbox.checked = layer.getVisible();
                checkbox.addEventListener('change', function () {
                    layer.setVisible(checkbox.checked);
                });

                layer.on('change:visible', function () {
                    checkbox.checked = layer.getVisible();
                });
            }

            connectLayer('check-hidrografia', lyr_hidrografia_1);
            connectLayer('check-limite', lyr_LIMITE__2);
            connectLayer('check-parcelas', lyr_parcelas_3);
            connectLayer('check-areas-verdes', lyr_areas_verdes_4);
            connectLayer('check-lotes', lyr_lotes_urbanos_5);
            connectLayer('check-red-vial', lyr_red_vial_6);
            connectLayer('check-equipamientos', lyr_equipamientos_7);
            connectLayer('check-buffer-salud', lyr_buffer_salud_8);
            connectLayer('check-buffer-educacion', lyr_buffer_educacin_9);

            var menuButton = document.getElementById('mobile-menu');
            menuButton.addEventListener('click', function () {
                document.body.classList.toggle('sidebar-open');
                window.setTimeout(function () { map.updateSize(); }, 260);
            });

            window.addEventListener('resize', function () { map.updateSize(); });
            window.setTimeout(function () { map.updateSize(); }, 100);
        })();
    </script>
</body>
</html>
